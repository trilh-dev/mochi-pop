plugins { id 'com.android.application' }

// Upload key lives outside git: ../../credentials/keystore.properties (see README).
def ksFile = rootProject.file('../credentials/keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.mochipop.game'
    compileSdk 36
    defaultConfig {
        applicationId 'com.vanlangtechnologies.mochipop'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        // Debug builds use Google's AdMob test ids, so no real ads are ever requested while testing.
        debug {
            manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'AD_REWARDED', '"ca-app-pub-3940256099942544/5224354917"'
            buildConfigField 'String', 'AD_INTERSTITIAL', '"ca-app-pub-3940256099942544/1033173712"'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            manifestPlaceholders = [admobAppId: 'ca-app-pub-8373248530102827~8724626185']
            buildConfigField 'String', 'AD_REWARDED', '"ca-app-pub-8373248530102827/2316586777"'
            buildConfigField 'String', 'AD_INTERSTITIAL', '"ca-app-pub-8373248530102827/3928876331"'
        }
    }
    // The game itself lives in ../../www (built by `node build.mjs` in the game folder).
    sourceSets { main { assets.srcDirs = ['../../www'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.android.billingclient:billing:9.1.0'
}
