name: MochiPop
options:
  bundleIdPrefix: com.vanlangtechnologies
  deploymentTarget: {iOS: "15.0"}
settings:
  base:
    DEVELOPMENT_TEAM: 4L85G6SA44
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
targets:
  MochiPop:
    type: application
    platform: iOS
    sources:
      - path: MochiPop
      - path: ../www/index.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vanlangtechnologies.mochipop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MochiPop/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "iPhone Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "MochiPop AppStore"
