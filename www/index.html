:root{
  --ink:#5a3b5d; --ink2:#8a6a8d; --pink:#ff7aa8; --pink2:#ffb3cf; --cream:#fff8fb;
  --card:#fffafc; --line:#f3d5e4; --mint:#5fd9a0; --sky:#5db8f5; --gold:#ffc83d;
  --bg1:#ffe0ef; --bg2:#e2efff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:'Fredoka','Arial Rounded MT Bold','Nunito',system-ui,sans-serif;font-weight:600;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hidden{display:none!important}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 12px 6px 8px;
  box-shadow:0 3px 0 rgba(210,150,190,.35),0 6px 14px rgba(200,120,170,.15);font-size:17px}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2 0 18%,#ffd64d 30%,#f5a623 100%);
  box-shadow:inset 0 -2px 0 rgba(190,110,0,.35)}
.coin.lg{width:28px;height:28px}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
#hud>*{pointer-events:auto}
.iconbtn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.85);font-size:20px;box-shadow:0 3px 0 rgba(210,150,190,.35);display:grid;place-items:center}
.iconbtn:active,.tile:active,.big:active,.btn:active,.boost:active{transform:translateY(2px) scale(.97)}
.scorebox{text-align:center;line-height:1}
#score{font-size:44px;font-weight:700;color:#fff;text-shadow:0 3px 0 #e86fa0,0 0 1px #e86fa0,2px 2px 0 #e86fa0,-2px 2px 0 #e86fa0,0 6px 12px rgba(232,111,160,.35);transition:transform .1s}
#score.bump{transform:scale(1.15)}
#best{font-size:15px;color:var(--ink2);margin-bottom:4px}
/* boosters */
#boosters{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:center;gap:14px}
.boost{position:relative;width:62px;height:56px;border-radius:18px;background:rgba(255,255,255,.88);font-size:26px;box-shadow:0 4px 0 rgba(210,150,190,.4);display:grid;place-items:center;transition:transform .1s}
.boost b{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--pink);color:#fff;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 0 #d9578a}
.boost b.buy{background:var(--gold);color:#7a4a00;box-shadow:0 2px 0 #d39b17}
.boost.on{background:#fff2a8;box-shadow:0 0 0 3px var(--gold),0 4px 0 rgba(210,150,190,.4);animation:wob .6s infinite}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
#toolHint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 80px);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:15px;white-space:nowrap}
#stuck{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 80px);background:#fff;border-radius:18px;padding:10px 12px 10px 16px;display:flex;gap:10px;align-items:center;
  box-shadow:0 6px 0 rgba(210,150,190,.4),0 10px 24px rgba(160,80,130,.2);font-size:15px;white-space:nowrap}
/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px)}
.topbar{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center}
.lvl{gap:8px}
.xpbar{width:70px;height:10px;border-radius:5px;background:#f6dbe8;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ee0b5,#5fd9a0);border-radius:5px}
.logo{margin:6vh 0 0;font-size:min(19vw,92px);line-height:.92;text-align:center;font-weight:700;letter-spacing:1px}
.logo span{display:block}
.logo i{font-style:normal;display:inline-block;color:#fff;animation:hop 2.4s ease-in-out infinite;
  text-shadow:0 4px 0 var(--c),3px 3px 0 var(--c),-3px 3px 0 var(--c),3px -2px 0 var(--c),-3px -2px 0 var(--c),0 10px 18px rgba(200,90,150,.3)}
@keyframes hop{0%,70%,100%{transform:translateY(0) scale(1,1)}78%{transform:translateY(-14px) scale(.95,1.06)}86%{transform:translateY(0) scale(1.08,.92)}}
.tag{margin-top:10px;color:var(--ink2);font-size:16px}
.bestline{margin-top:auto;font-size:18px;color:var(--ink2)}
.big{margin:14px 0 18px;width:min(78vw,320px);height:78px;border-radius:28px;font-size:34px;font-weight:700;color:#fff;letter-spacing:2px;
  background:linear-gradient(180deg,#ff9fc2,#ff6f9f);box-shadow:0 7px 0 #d9578a,0 14px 26px rgba(217,87,138,.35);text-shadow:0 2px 0 rgba(180,50,100,.4);
  animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.big small{display:block;font-size:14px;letter-spacing:0;opacity:.9;margin-top:-4px}
.row{display:flex;gap:12px;width:100%;max-width:420px}
.tile{flex:1;position:relative;height:84px;border-radius:22px;background:rgba(255,255,255,.88);box-shadow:0 5px 0 rgba(210,150,190,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:30px}
.tile span{font-size:14px;color:var(--ink)}
.dot{position:absolute;top:8px;right:10px;width:14px;height:14px;border-radius:50%;background:#ff5d7a;box-shadow:0 0 0 3px #fff;animation:breathe 1s infinite}
/* modal */
#modal{position:fixed;inset:0;background:rgba(90,59,93,.38);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{width:min(100%,400px);max-height:88vh;overflow:auto;background:var(--card);border-radius:28px;padding:22px 18px 18px;text-align:center;
  box-shadow:0 8px 0 rgba(210,150,190,.45),0 20px 50px rgba(120,50,100,.3);animation:popin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0 0 6px;font-size:30px;color:var(--pink)}
.card p{margin:4px 0;color:var(--ink2);font-weight:500}
.btn{display:block;width:100%;margin-top:12px;height:56px;border-radius:20px;font-size:21px;font-weight:700;color:#fff;background:linear-gradient(180deg,#ff9fc2,#ff6f9f);box-shadow:0 5px 0 #d9578a}
.btn.green{background:linear-gradient(180deg,#8ff0c4,#4fcf93);box-shadow:0 5px 0 #33a874}
.btn.blue{background:linear-gradient(180deg,#9fd6ff,#5db8f5);box-shadow:0 5px 0 #3994d6}
.btn.gold{background:linear-gradient(180deg,#ffe27a,#ffc23d);box-shadow:0 5px 0 #d39b17;color:#7a4a00}
.btn.ghost{background:#f6e6ef;color:var(--ink);box-shadow:0 5px 0 #e6cad9}
.btn[disabled]{filter:grayscale(.7);opacity:.6}
.btn.sm{height:40px;font-size:16px;border-radius:14px;margin:0;width:auto;padding:0 14px;display:inline-block}
.bigscore{font-size:64px;font-weight:700;color:var(--ink);line-height:1.1}
.newbest{display:inline-block;background:var(--gold);color:#7a4a00;padding:4px 12px;border-radius:999px;font-size:16px;animation:breathe .8s infinite}
.reward{display:flex;justify-content:center;gap:8px;align-items:center;font-size:22px;margin:8px 0}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.day{border-radius:16px;background:#f9e9f1;padding:8px 2px;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:4px}
.day b{font-size:16px;color:var(--ink)}
.day.done{background:#d9f7e8;opacity:.7}
.day.today{background:#fff2a8;box-shadow:0 0 0 3px var(--gold);animation:breathe 1s infinite}
.day.d7{grid-column:span 2}
.mission{display:flex;align-items:center;gap:10px;text-align:left;background:#fbeef4;border-radius:18px;padding:10px 12px;margin-top:10px}
.mission .ic{font-size:26px}
.mission .tx{flex:1;font-size:15px}
.prog{height:9px;border-radius:5px;background:#f0d3e1;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffb3cf,#ff7aa8)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.skin{border-radius:16px;background:#fbeef4;padding:6px 2px 6px;font-size:12px;position:relative}
.skin canvas{width:100%;aspect-ratio:1;display:block}
.skin.locked canvas{filter:brightness(0) opacity(.18)}
.skin.sel{background:#fff2a8;box-shadow:0 0 0 3px var(--gold)}
.skin em{font-style:normal;display:block;font-size:10px;color:var(--ink2)}
.capsule{width:130px;height:130px;margin:6px auto;display:block}
.capsule.shake{animation:cshake .5s ease-in-out 2}
@keyframes cshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.05)}75%{transform:rotate(12deg) scale(1.05)}}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 6px;border-bottom:2px dashed var(--line);font-size:18px}
.sw{width:58px;height:32px;border-radius:16px;background:#ead3df;position:relative;transition:background .2s}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 3px rgba(0,0,0,.15)}
.sw.on{background:var(--mint)}
.sw.on::after{left:30px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 76px);transform:translateX(-50%) translateY(-20px);opacity:0;background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:16px;transition:all .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <button id="btnPause" class="iconbtn" aria-label="Pause">⏸</button>
  <div class="scorebox"><div id="best">👑 0</div><div id="score">0</div></div>
  <div class="pill" id="pillHud"><i class="coin"></i><b id="coinsHud">0</b></div>
</div>

<div id="boosters" class="hidden">
  <button class="boost" data-tool="hammer" aria-label="Hammer">🔨<b>0</b></button>
  <button class="boost" data-tool="bomb" aria-label="Bomb">💣<b>0</b></button>
  <button class="boost" data-tool="swap" aria-label="New pieces">🔄<b>0</b></button>
</div>
<div id="toolHint" class="hidden"></div>
<div id="stuck" class="hidden"><span>No room! Try a booster?</span><button id="btnGiveUp" class="btn sm ghost">Give up</button></div>

<div id="home" class="screen">
  <div class="topbar">
    <div class="pill lvl">Lv <b id="lvl">1</b><div class="xpbar"><i id="xp"></i></div></div>
    <div class="pill" id="pillHome"><i class="coin"></i><b id="coinsHome">0</b></div>
  </div>
  <h1 class="logo">
    <span><i style="--c:#ff6f9f">M</i><i style="--c:#ffa65c;animation-delay:.1s">o</i><i style="--c:#e0b421;animation-delay:.2s">c</i><i style="--c:#38b57d;animation-delay:.3s">h</i><i style="--c:#3994d6;animation-delay:.4s">i</i></span>
    <span><i style="--c:#7f5fd6;animation-delay:.5s">P</i><i style="--c:#ff6f9f;animation-delay:.6s">o</i><i style="--c:#ffa65c;animation-delay:.7s">p</i><i style="--c:#38b57d;animation-delay:.8s">!</i></span>
  </h1>
  <div class="tag">Drop. Pop. Combo. Collect!</div>
  <div class="bestline">👑 Best <b id="bestHome">0</b></div>
  <button id="btnPlay" class="big">PLAY</button>
  <div class="row">
    <button id="btnMissions" class="tile">📋<span>Missions</span><em id="missDot" class="dot hidden"></em></button>
    <button id="btnCollection" class="tile">🎁<span>Capsules</span><em id="capDot" class="dot hidden"></em></button>
    <button id="btnShop" class="tile hidden">🛒<span>Shop</span></button>
    <button id="btnSettings" class="tile">⚙️<span>Settings</span></button>
  </div>
</div>

<div id="modal" class="hidden"><div class="card" id="card"></div></div>
<div id="toast"></div>

<script>
(() => {
'use strict';

// ---------- basics ----------
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const cv = $('#cv'), ctx = cv.getContext('2d');
const N = 8;
const rand = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c = 1.7; t = clamp(t, 0, 1) - 1; return 1 + (c + 1) * t * t * t + c * t * t; };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const yesterday = () => { const d = new Date(Date.now() - 864e5); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const fmt = n => Math.floor(n).toLocaleString('en-US');

const COLORS = [
  { a: '#FFC2D9', b: '#FF7AA8', d: '#D9578A' }, // strawberry
  { a: '#FFD9AE', b: '#FFA65C', d: '#DD7E33' }, // peach
  { a: '#FFF3B0', b: '#FFD84D', d: '#D9AE1F' }, // lemon
  { a: '#C2F7DD', b: '#5FD9A0', d: '#33A874' }, // matcha
  { a: '#C7EAFF', b: '#5DB8F5', d: '#3994D6' }, // soda
  { a: '#E2D4FF', b: '#A585F5', d: '#7A58D6' }, // taro
  { a: '#FFCBC5', b: '#FF6F6F', d: '#D94B4B' }, // cherry
];

const SKINS = [
  { id: 'mochi', name: 'Mochi', rarity: 'Common' },
  { id: 'kitty', name: 'Kitty', rarity: 'Common' },
  { id: 'bear', name: 'Teddy', rarity: 'Common' },
  { id: 'bunny', name: 'Bunbun', rarity: 'Rare' },
  { id: 'chick', name: 'Chirp', rarity: 'Rare' },
  { id: 'frog', name: 'Froggy', rarity: 'Rare' },
  { id: 'panda', name: 'Panpan', rarity: 'Epic' },
  { id: 'alien', name: 'Blip', rarity: 'Epic' },
];
const RARITY_W = { Common: 5, Rare: 2.5, Epic: 1 };
const CAPSULE_COST = 150;
const BOOST_COST = { hammer: 40, bomb: 80, swap: 30 };
const CONTINUE_COST = 100;
const DAILY = [30, 40, 50, 60, 80, 100, 200];
const GAME_VERSION = 3;
const NATIVE = window.Android || {};
const HAS_ADS = typeof NATIVE.showRewarded === 'function';
const HAS_IAP = typeof NATIVE.buy === 'function';
const PACKS = { coins_500: 500, coins_1500: 1500, coins_5000: 5000 };
const AD_COINS = 40, AD_COINS_PER_DAY = 5;
let products = [];
try { if (HAS_IAP) products = JSON.parse(NATIVE.products() || '[]'); } catch (e) {}
const price = id => (products.find(p => p.id === id) || {}).price;
const noAds = () => S.noAds || (HAS_IAP && NATIVE.noAds());
let shopOpen = false, adShowing = false, lastRewarded = 0;
const adCbs = {};

// ---------- shapes ----------
const BASE = [
  [[[0,0]], 2.5],
  [[[0,0],[1,0]], 4],
  [[[0,0],[1,0],[2,0]], 4],
  [[[0,0],[1,0],[2,0],[3,0]], 3],
  [[[0,0],[1,0],[2,0],[3,0],[4,0]], 1.6],
  [[[0,0],[1,0],[0,1],[1,1]], 5],
  [[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]], 1.3],
  [[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]], 2],
  [[[0,0],[1,0],[0,1]], 4],
  [[[0,0],[0,1],[0,2],[1,2]], 3],
  [[[1,0],[1,1],[1,2],[0,2]], 3],
  [[[0,0],[1,0],[2,0],[1,1]], 3],
  [[[1,0],[2,0],[0,1],[1,1]], 2],
  [[[0,0],[1,0],[1,1],[2,1]], 2],
  [[[0,0],[0,1],[0,2],[1,2],[2,2]], 1.6],
  [[[0,0],[1,1]], 1],
];
function norm(cells) {
  const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1]));
  return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
}
const rot = cells => norm(cells.map(([x, y]) => [-y, x]));
const SHAPES = [];
for (const [cells, w] of BASE) {
  const seen = new Set(); let c = norm(cells); const rots = [];
  for (let i = 0; i < 4; i++) { const k = JSON.stringify(c); if (!seen.has(k)) { seen.add(k); rots.push(c); } c = rot(c); }
  for (const r of rots) SHAPES.push({
    cells: r, w: w / rots.length * Math.min(rots.length, 2),
    gw: Math.max(...r.map(p => p[0])) + 1, gh: Math.max(...r.map(p => p[1])) + 1,
  });
}

// ---------- persistence ----------
const SAVE_KEY = 'mochipop_v1';
const DEFAULT = () => ({
  best: 0, coins: 120, level: 1, xp: 0,
  power: { hammer: 2, bomb: 1, swap: 2 },
  skins: ['mochi'], skin: 'mochi',
  settings: { sound: true, music: true, vib: true },
  daily: { last: '', streak: 0 },
  missions: null, tutorialDone: false, run: null, games: 0, capsulesOpened: 0,
  noAds: false, tokens: [], adCoins: { day: '', n: 0 }, gamesSinceAd: 0, lastAd: 0,
});
let S = DEFAULT();
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) S = Object.assign(DEFAULT(), JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

// ---------- audio ----------
let AC = null, master = null, musicTimer = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    startMusic();
  } catch (e) { AC = null; }
}
function tone(freq, dur = 0.12, type = 'sine', vol = 0.25, slide = 0, delay = 0) {
  if (!AC || !S.settings.sound) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  pick() { tone(660, 0.06, 'sine', 0.15, 880); },
  place() { tone(420, 0.1, 'sine', 0.3, 200); tone(900, 0.05, 'triangle', 0.08, 0, 0.01); },
  bad() { tone(220, 0.12, 'square', 0.06, 160); },
  clear(lines, combo) {
    const base = 523.25 * Math.pow(2, Math.min(combo, 10) / 12);
    const steps = [0, 4, 7, 12, 16, 19];
    for (let i = 0; i < Math.min(3 + lines, 6); i++) tone(base * Math.pow(2, steps[i] / 12), 0.18, 'triangle', 0.22, 0, i * 0.06);
  },
  coin() { tone(988, 0.07, 'square', 0.06); tone(1319, 0.12, 'square', 0.06, 0, 0.07); },
  fever() { tone(300, 0.6, 'sawtooth', 0.08, 1200); for (let i = 0; i < 5; i++) tone(700 + i * 150, 0.12, 'triangle', 0.15, 0, 0.1 + i * 0.07); },
  over() { [523, 440, 349, 262].forEach((f, i) => tone(f, 0.25, 'triangle', 0.2, 0, i * 0.15)); },
  tap() { tone(800, 0.04, 'sine', 0.1); },
  boom() { tone(160, 0.4, 'sawtooth', 0.2, 40); tone(90, 0.5, 'sine', 0.3, 30); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, 'triangle', 0.2, 0, i * 0.08)); },
};
function startMusic() {
  if (musicTimer || !AC) return;
  const prog = [[262, 330, 392], [220, 262, 330], [175, 220, 262], [196, 247, 294]];
  const mel = [0, 2, 4, 7, 9, 7, 4, 2];
  let step = 0;
  musicTimer = setInterval(() => {
    if (!S.settings.music || document.hidden) return;
    const chord = prog[Math.floor(step / 8) % 4];
    if (step % 4 === 0) tone(chord[0] / 2, 0.9, 'sine', 0.07);
    if (step % 2 === 0) tone(chord[(step / 2) % 3] * 2, 0.25, 'triangle', 0.025);
    if (Math.random() < 0.45) { const n = mel[rand(mel.length)]; tone(chord[0] * 2 * Math.pow(2, n / 12), 0.3, 'sine', 0.03); }
    step++;
  }, 260);
}
function vib(p) {
  if (!S.settings.vib) return;
  try {
    if (window.Android && window.Android.vibrate) window.Android.vibrate(Array.isArray(p) ? p[0] + (p[2] || 0) : p);
    else if (navigator.vibrate) navigator.vibrate(p);
  } catch (e) {}
}

// ---------- mochi sprite renderer ----------
const spriteCache = new Map();
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function drawMochi(c, s, ci, skin, face, star) {
  const col = COLORS[ci];
  const eared = skin !== 'mochi';
  const top = eared ? s * 0.17 : s * 0.06;
  const bx = s * 0.06, bw = s * 0.88, bh = s * 0.94 - top;
  c.lineWidth = s * 0.05; c.strokeStyle = col.d; c.lineJoin = 'round';
  const fillEar = (f) => { c.fillStyle = f; c.fill(); c.stroke(); };
  // ears / accessories behind body
  if (skin === 'kitty') {
    for (const sx of [0.22, 0.78]) { c.beginPath(); c.moveTo(s * (sx - 0.15), s * 0.36); c.lineTo(s * (sx + (sx < .5 ? -0.04 : 0.04)), s * 0.04); c.lineTo(s * (sx + 0.15), s * 0.3); c.closePath(); fillEar(col.b); }
  } else if (skin === 'bear' || skin === 'panda') {
    for (const sx of [0.22, 0.78]) { c.beginPath(); c.arc(s * sx, s * 0.2, s * 0.13, 0, 7); fillEar(skin === 'panda' ? '#4a3d55' : col.b); }
  } else if (skin === 'bunny') {

function makePiece(shape) {

}

const PRAISE = ['', 'Nice!', 'Sweet!', 'Yummy!', 'Delicious!', 'Mochi-licious!'];
function place(pi, gx, gy) {

    const set = new Map();

      if (cell.star) stars++;

    const base = [0, 100, 300, 600, 1000, 1500, 2100][Math.min(lines, 6)];
    const mult = (1 + (G.combo - 1) * 0.5) * (G.feverTurns > 0 ? 2 : 1);
    let pts = Math.round(base * mult) + sweet * 250;
    const perfect = G.grid.every(r => r.every(c => !c));

    if (G.combo >= 2) floatText('Combo x' + G.combo, VW / 2, L.by + L.bs * 0.55, '#fff6a8', 34, '#e08a00');
    if (sweet) floatText(sweet > 1 ? 'Sweet Line x' + sweet + '!' : 'Sweet Line!', VW / 2, L.by + L.bs * 0.7, '#fff', 30, '#33a874');

  const pool = MISSION_POOL.slice().sort(() => Math.random() - 0.5).slice(0, 3);
  const tier = Math.min(2, Math.floor((S.level - 1) / 4));

    const was = m.prog >= m.target; m.prog = Math.min(m.target, Math.max(m.prog, v));

function drawBoard(dt) {

function drawPiece(p, cx, cy, scale, alpha = 1) {

function drawTray(dt) {

    if (!p || (drag && drag.pi === i)) return;

    p.anim = Math.min(1, (p.anim || 0) + dt * 3.5);

}
function drawFx(dt) {

}
function openMissions() {
  ensureMissions(); SFX.tap();
  const html = S.missions.list.map((m, i) => {
    const def = MISSION_POOL.find(d => d.id === m.id), done = m.prog >= m.target;
    return `<div class="mission"><div class="ic">${def.icon}</div><div class="tx">${def.text(m.target)}<div class="prog"><i style="width:${100 * m.prog / m.target}%"></i></div></div>
      ${m.claimed ? '✅' : done ? `<button class="btn sm gold" data-i="${i}">+${m.reward}</button>` : `<small>${fmt(m.prog)}/${fmt(m.target)}</small>`}</div>`;
  }).join('');
  modal(`<h2>Daily missions</h2><p>New missions every day</p>${html}<button class="btn ghost" data-close>Close</button>`, card => {
    card.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const m = S.missions.list[+b.dataset.i]; m.claimed = true; S.coins += m.reward; save(); SFX.coin(); confetti(30); openMissions(); });
  });
}
function skinThumb(id, canvas, ci) {
  const s = canvas.width = canvas.height = 96;
  drawMochi(canvas.getContext('2d'), s, ci, id, 0, false);
}
function openCollection() {
  SFX.tap();
  const all = S.skins.length >= SKINS.length;
  modal(`<h2>Capsule Machine</h2><p>Collect cute mochi friends! Tap one you own to use it.</p>
    <svg class="capsule" id="cap" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#ffd6e8" stroke="#d9578a" stroke-width="4"/><path d="M6 50a44 44 0 0 0 88 0z" fill="#a585f5" stroke="#7a58d6" stroke-width="4"/><circle cx="50" cy="50" r="10" fill="#fff" stroke="#7a58d6" stroke-width="4"/><ellipse cx="32" cy="28" rx="10" ry="6" fill="#fff" opacity=".7" transform="rotate(-30 32 28)"/></svg>
    <button class="btn gold" id="mRoll" ${S.coins >= CAPSULE_COST ? '' : 'disabled'}>${all ? 'Roll for coins' : 'Open capsule'} · ${CAPSULE_COST} <i class="coin"></i></button>
    <div class="grid">${SKINS.map((k, i) => `<div class="skin ${S.skins.includes(k.id) ? '' : 'locked'} ${S.skin === k.id ? 'sel' : ''}" data-id="${k.id}"><canvas></canvas>${S.skins.includes(k.id) ? k.name : '???'}<em>${k.rarity}</em></div>`).join('')}</div>
    <p style="margin-top:10px">You have <b>${fmt(S.coins)}</b> coins</p>
    ${S.coins < CAPSULE_COST && (HAS_ADS || HAS_IAP) ? '<button class="btn blue" id="mGetCoins">🛒 Get coins</button>' : ''}
    <button class="btn ghost" data-close>Close</button>`, card => {
    const gc = card.querySelector('#mGetCoins'); if (gc) gc.onclick = openShop;
    card.querySelectorAll('.skin').forEach((el, i) => {
      skinThumb(el.dataset.id, el.querySelector('canvas'), i % COLORS.length);
      el.onclick = () => { if (!S.skins.includes(el.dataset.id)) { toast('Open capsules to unlock!'); return; } S.skin = el.dataset.id; save(); SFX.tap(); openCollection(); };
    });
    card.querySelector('#mRoll').onclick = () => {
      if (S.coins < CAPSULE_COST) return;
      S.coins -= CAPSULE_COST; S.capsulesOpened++; save();
      const cap = card.querySelector('#cap'); cap.classList.add('shake'); SFX.tap();
      card.querySelector('#mRoll').disabled = true;
      setTimeout(() => {
        let tot = 0; SKINS.forEach(k => tot += RARITY_W[k.rarity]);
        let r = Math.random() * tot, got = SKINS[0];
        for (const k of SKINS) { r -= RARITY_W[k.rarity]; if (r <= 0) { got = k; break; } }
        const dupe = S.skins.includes(got.id);
        if (dupe) S.coins += 60; else { S.skins.push(got.id); S.skin = got.id; }
        save(); SFX.win(); confetti(90);
        modal(`<h2>${dupe ? 'Again!' : 'New friend!'}</h2><canvas id="gotCv" style="width:150px;height:150px"></canvas>
          <div class="bigscore" style="font-size:36px">${got.name}</div><p>${got.rarity}${dupe ? ' · duplicate, +60 coins back' : ' · now equipped!'}</p>
          <button class="btn" id="mMore">Yay!</button>`, c2 => {
          const g = c2.querySelector('#gotCv'); g.width = g.height = 200; drawMochi(g.getContext('2d'), 200, rand(COLORS.length), got.id, 2, false);
          c2.querySelector('#mMore').onclick = openCollection;
        });
      }, 1050);
    };
  });
}
function openSettings() {
  SFX.tap();
  const row = (k, label) => `<div class="setrow">${label}<button class="sw ${S.settings[k] ? 'on' : ''}" data-k="${k}"></button></div>`;
  modal(`<h2>Settings</h2>${row('sound', '🔊 Sound')}${row('music', '🎵 Music')}${row('vib', '📳 Vibration')}
    <p style="margin-top:12px">Games played: ${S.games} · Capsules: ${S.capsulesOpened}</p>
    <p style="font-size:13px">Version ${GAME_VERSION}</p>
    ${HAS_IAP ? '<button class="btn blue" id="mRestore">Restore purchases</button>' : ''}
    ${HAS_ADS && NATIVE.privacyOptionsRequired() ? '<button class="btn blue" id="mPrivacy">Privacy options</button>' : ''}
    <button class="btn ghost" data-close>Close</button>`, card => {
    const r = card.querySelector('#mRestore'); if (r) r.onclick = () => { NATIVE.restorePurchases(); toast('Checking your purchases…'); };
    const pv = card.querySelector('#mPrivacy'); if (pv) pv.onclick = () => NATIVE.showPrivacyOptions();
    card.querySelectorAll('.sw').forEach(b => b.onclick = () => { S.settings[b.dataset.k] = !S.settings[b.dataset.k]; b.classList.toggle('on'); save(); SFX.tap(); });
  });
}
function openPause() {
  SFX.tap(); setTool(null);
  modal(`<h2>Paused</h2><p>Your board is saved. Come back anytime!</p>
    <button class="btn green" data-close>Resume</button>
    <button class="btn blue" id="mSet">Settings</button>
    <button class="btn ghost" id="mHome">Home</button>`, card => {
    card.querySelector('#mHome').onclick = () => { saveRun(); closeModal(); show('home'); };
    card.querySelector('#mSet').onclick = openSettings;
  });
}

$('#btnPlay').addEventListener('click', startGame);
$('#btnMissions').addEventListener('click', () => { initAudio(); openMissions(); });
$('#btnCollection').addEventListener('click', () => { initAudio(); openCollection(); });
$('#btnSettings').addEventListener('click', () => { initAudio(); openSettings(); });
$('#btnShop').addEventListener('click', () => { initAudio(); openShop(); });
$('#pillHome').addEventListener('click', () => { if (HAS_ADS || HAS_IAP) { initAudio(); openShop(); } });
$('#pillHud').addEventListener('click', () => { if ((HAS_ADS || HAS_IAP) && G && !G.over) { initAudio(); setTool(null); openShop(); } });
$('#btnPause').addEventListener('click', openPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveRun(); if (AC) AC.suspend(); } else if (AC) AC.resume(); });
document.addEventListener('contextmenu', e => e.preventDefault());

// Android back button (called by the native wrapper)
window.__back = () => {
  if (!$('#modal').classList.contains('hidden')) { if (G && G.over) return; closeModal(); }
  else if (tool) setTool(null);
  else if (screen === 'game') openPause();
  else if (window.Android && window.Android.exit) window.Android.exit();
};

// Over-the-air update downloaded by the Android app: reload right away if the player is on the
// home screen, otherwise as soon as they get back there. Progress is saved, so nothing is lost.
let otaPending = false;
function applyOta() {
  if (otaPending && screen === 'home' && $('#modal').classList.contains('hidden') && window.Android && window.Android.reload) {
    otaPending = false; window.Android.reload();
  }
}
window.__otaReady = v => { otaPending = true; toast('New update ready! ✨'); setTimeout(applyOta, 1200); };
setInterval(applyOta, 2000);

// ---------- ads & purchases (needs Android wrapper level 2; hidden everywhere else) ----------
function rewardedReady() { return HAS_ADS && NATIVE.rewardedReady(); }
function showAd(tag, cb) {
  if (!HAS_ADS || adShowing) return cb(false);
  adShowing = true; adCbs[tag] = cb;
  if (AC) AC.suspend();
  if (tag === 'interstitial') NATIVE.showInterstitial(); else NATIVE.showRewarded(tag);
}
window.__adDone = (tag, ok) => {
  adShowing = false;
  if (AC && !document.hidden) AC.resume();
  if (tag !== 'interstitial' && ok) lastRewarded = Date.now();
  const cb = adCbs[tag]; delete adCbs[tag];
  if (cb) cb(ok);
};
// Between games only: never in the first 3 games, at most every 3rd game and 3 minutes apart,
// and not right after the player chose to watch a reward video.
function maybeInterstitial(next) {
  S.gamesSinceAd++; save();
  const now = Date.now();
  if (!HAS_ADS || noAds() || S.games < 3 || S.gamesSinceAd < 3 || now - S.lastAd < 180000 || now - lastRewarded < 90000) return next();
  showAd('interstitial', shown => { if (shown) { S.gamesSinceAd = 0; S.lastAd = Date.now(); save(); } next(); });
}
const adCoinsLeft = () => S.adCoins.day === today() ? Math.max(0, AD_COINS_PER_DAY - S.adCoins.n) : AD_COINS_PER_DAY;
function openShop() {
  SFX.tap();
  const row = (id, icon, title, sub) => `<div class="mission"><div class="ic">${icon}</div><div class="tx">${title}<br><small>${sub}</small></div>
    <button class="btn sm gold" data-buy="${id}" ${price(id) ? '' : 'disabled'}>${price(id) || '…'}</button></div>`;
  const left = adCoinsLeft();
  modal(`<h2>Shop</h2><p>You have <b>${fmt(S.coins)}</b> <i class="coin"></i></p>
    ${HAS_ADS ? `<div class="mission"><div class="ic">🎬</div><div class="tx">Free coins<br><small>Watch a short video · ${left} left today</small></div>
      <button class="btn sm green" id="mFree" ${left > 0 ? '' : 'disabled'}>+${AD_COINS}</button></div>` : ''}
    ${HAS_IAP ? Object.keys(PACKS).map((id, i) => row(id, i === 2 ? '💎' : '💰', fmt(PACKS[id]) + ' coins', ['A handful of treats', 'Most popular', 'Best value'][i])).join('') : ''}
    ${HAS_IAP ? (noAds() ? '<p style="margin-top:12px">✅ Ads removed. Thank you!</p>' : row('remove_ads', '🚫', 'Remove ads', 'No more ads between games. Reward videos stay optional.')) : ''}
    <button class="btn ghost" data-close>Close</button>`, card => {
    card.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { SFX.tap(); NATIVE.buy(b.dataset.buy); });
    const f = card.querySelector('#mFree');
    if (f) f.onclick = () => {
      if (!rewardedReady()) { toast('No video right now. Try again soon!'); return; }
      showAd('coins', ok => {
        if (ok && adCoinsLeft() > 0) {
          if (S.adCoins.day !== today()) S.adCoins = { day: today(), n: 0 };
          S.adCoins.n++; S.coins += AD_COINS; save(); SFX.coin(); confetti(30); lastHud = ''; updateHud();
        }
        if (shopOpen) openShop();
      });
    };
  });
  shopOpen = true;
}
window.__products = list => { products = list; if (shopOpen) openShop(); };
// Play hands over each paid purchase (again after a crash, until finished). Tokens make it idempotent.
window.__purchase = (id, token) => {
  if (!S.tokens.includes(token)) {
    S.tokens.push(token); if (S.tokens.length > 100) S.tokens.shift();
    if (id === 'remove_ads') { S.noAds = true; toast('Ads removed. Thank you! 💖'); }
    else if (PACKS[id]) { S.coins += PACKS[id]; SFX.coin(); confetti(80); toast(`+${fmt(PACKS[id])} coins. Thank you! 💖`); }
  } else if (id === 'remove_ads') S.noAds = true;
  save();
  NATIVE.finishPurchase(token);
  lastHud = ''; updateHud();
  if (shopOpen) openShop(); else if (screen === 'home' && $('#modal').classList.contains('hidden')) refreshHome();
};
window.__purchaseFailed = code => toast(code === -1 ? 'The store isn\'t available right now' : 'Purchase didn\'t go through. Please try again.');

// test hook
window.__mochi = { get G() { return G; }, get S() { return S; }, place, canPlace, fitsAnywhere, startGame, gameOver, drawMochi, L };

resize();
ensureMissions();
if (HAS_IAP) NATIVE.billingReady();
show('home');
setTimeout(dailyCheck, 400);
requestAnimationFrame(frame);
})();

</script>
</body>
</html>
